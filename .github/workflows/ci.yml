name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compat:
    name: PHP 5.6 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint with PHP 5.6
        run: docker run --rm -v "$PWD:/src:ro" php:5.6-cli php -l /src/custom-global-variables.php
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: PHPCompatibilityWP (testVersion 5.6-)
        run: composer compat

  wp-versions:
    name: Resolve WordPress versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - id: resolve
        name: Current stable and the latest release of the previous major
        run: |
          versions=$(curl -fsSL https://api.wordpress.org/core/version-check/1.7/ | python3 -c '
          import json, sys
          offers = json.load(sys.stdin)["offers"]
          seen = []
          for v in sorted({o["current"] for o in offers}, key=lambda v: [int(x) for x in v.split(".")], reverse=True):
              branch = ".".join(v.split(".")[:2])
              if branch not in [".".join(s.split(".")[:2]) for s in seen]:
                  seen.append(v)
          print(json.dumps(seen[:2]))
          ')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "$versions"

  test:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    needs: wp-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
        wp: ${{ fromJson(needs.wp-versions.outputs.versions) }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer
          coverage: none
          ini-values: error_reporting=E_ALL, display_errors=On
      - run: composer install --no-interaction --no-progress
      - run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }}
      - run: vendor/bin/phpunit
